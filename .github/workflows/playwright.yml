name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer le pipeline manuellement depuis GitHub
  schedule:
    - cron: '0 8 * * *' # Exécution tous les jours à 8h00 UTC (ajustez selon votre fuseau horaire)

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    # 1. Récupérer le code source du projet
    - uses: actions/checkout@v4

    # 2. Installer Node.js
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # 3. Installer les dépendances du projet (npm ci est plus rapide et stable en CI)
    - name: Install dependencies
      run: npm ci

    # 4. Installer les navigateurs Playwright et leurs dépendances système (sur Linux)
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 5. Exécuter les tests E2E
    - name: Run Playwright tests
      run: npx playwright test

    # 6. Sauvegarder le rapport HTML en cas d'échec ou de succès (Artifacts)
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30